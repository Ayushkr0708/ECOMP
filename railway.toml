[build]
builder = "nixpacks"

[build.buildCommand]
frontend = "cd frontend && npm run build"

[start]
backend = "cd backend && pip install -r requirements.txt && gunicorn app:app -w 4 -b 0.0.0.0:$PORT"
frontend = "cd frontend && npm run preview -- --host 0.0.0.0 --port $PORT"

[deploy]
numReplicas = 1